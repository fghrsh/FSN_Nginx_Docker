user nginx;
pid /var/run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    worker_connections 65535;
}

include /opt/verynginx/nginx_conf/in_external.conf;

http {
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    server_names_hash_bucket_size 128;
    client_header_buffer_size 4k;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 4k;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # MIME
    include mime.types;
    types {
        application/geo+json geojson;
        application/ld+json jsonld;
        application/manifest+json webmanifest;
        font/otf otf;
        font/ttf ttf;
        text/csv csv;
        text/javascript mjs;
        text/vtt vtt;
    }
    default_type application/octet-stream;

    # logging
    access_log off;
    error_log /var/log/nginx/error.log warn;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" "$http_host" '
                    '$status $request_length $body_bytes_sent "$scheme" "$http_referer" '
                    '"$http_user_agent"  $request_time $upstream_response_time "$http_x_forwarded_for"';

    # FastCGI
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 128k;
    fastcgi_intercept_errors on;

    # SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Strict SNI
    strict_sni on;
    strict_sni_header on;

    # modern configuration
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:!DSS;
    ssl_prefer_server_ciphers on;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 208.67.222.222 223.5.5.5 119.29.29.29 valid=60s;
    resolver_timeout 2s;

    # Gzip Compression
    gzip on;
    gzip_buffers 16 8k;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/csv text/vtt text/x-component
        text/javascript application/javascript application/x-javascript
        text/xml application/xml application/atom+xml application/rss+xml application/xhtml+xml
        application/json text/x-json application/manifest+json application/x-web-app-manifest+json
        application/activity+json application/geo+json application/ld+json application/problem+json
        application/wasm
        font/ttf font/otf font/opentype application/x-font-ttf application/vnd.ms-fontobject
        image/svg+xml image/x-icon image/vnd.microsoft.icon;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Brotli Compression
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain text/css text/csv text/vtt text/x-component
        text/javascript application/javascript application/x-javascript
        text/xml application/xml application/atom+xml application/rss+xml application/xhtml+xml
        application/json text/x-json application/manifest+json application/x-web-app-manifest+json
        application/activity+json application/geo+json application/ld+json application/problem+json
        application/wasm
        font/ttf font/otf font/opentype application/x-font-ttf application/vnd.ms-fontobject
        image/svg+xml image/x-icon image/vnd.microsoft.icon;

    # Zstd Compression
    zstd on;
    zstd_min_length 256;
    zstd_comp_level 3;
    zstd_types
        text/plain text/css text/csv text/vtt text/x-component
        text/javascript application/javascript application/x-javascript
        text/xml application/xml application/atom+xml application/rss+xml application/xhtml+xml
        application/json text/x-json application/manifest+json application/x-web-app-manifest+json
        application/activity+json application/geo+json application/ld+json application/problem+json
        application/wasm
        font/ttf font/otf font/opentype application/x-font-ttf application/vnd.ms-fontobject
        image/svg+xml image/x-icon image/vnd.microsoft.icon;

    # this line shoud be include in every http block
    include /opt/verynginx/nginx_conf/in_http_block.conf;

    server {
        listen 443 default_server;

        # this line shoud be include in every server block
        include /opt/verynginx/nginx_conf/in_server_block.conf;

        server_name _;
        ssl_stapling off;
        ssl_certificate /etc/nginx/invalid.crt;
        ssl_certificate_key /etc/nginx/invalid.key;
        access_log off;
        return 444;
    }

    server {
        listen 80 default_server;

        # this line shoud be include in every server block
        include /opt/verynginx/nginx_conf/in_server_block.conf;

        server_name _;
        access_log off;
        return 444;
    }

    # load configs
    include /etc/nginx/vhosts/*.conf;
}
